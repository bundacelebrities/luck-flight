<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Luck Flight — Live Round</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png" type="image/png">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    :root {
      --bg: #050505;
      --panel: #0a0a0a;
      --panel-2: #0f0d08;
      --border: rgba(245, 190, 80, 0.18);
      --grid-line: rgba(245, 190, 80, 0.05);
      --text: #f2ede1;
      --text-dim: #8a8270;
      --text-faint: #4a4638;
      --gold-1: #ffe49a;
      --gold-2: #f4b942;
      --gold-3: #c8871a;
      --blue: #2e9bff;
      --blue-dim: #0891b2;
      --purple: #a855f7;
      --purple-dim: #7c3aed;
      --pink: #ff2d78;
      --red: #ff3b3b;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 22px 10px 8px;
    }

    /* ---------- Logo ---------- */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2px;
      user-select: none;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 0px;
    }

    .wing {
      display: block;
      filter: drop-shadow(0 0 6px rgba(244, 185, 66, 0.45));
    }

    .wing.right {
      transform: scaleX(-1);
    }

    .logo-luck {
      font-family: var(--sans);
      font-weight: 900;
      font-size: clamp(28px, 9vw, 38px);
      letter-spacing: 1px;
      line-height: 1;
      background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 45%, var(--gold-3) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 12px rgba(244, 185, 66, 0.5));
    }

    .logo-flight {
      font-weight: 800;
      font-size: clamp(12px, 3.4vw, 15px);
      letter-spacing: 4px;
      color: #f6f3ea;
      margin-top: 1px;
    }

    .entertainment-note {
      margin-top: 3px;
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    /* ---------- decorative connectors above/below the frame ---------- */
    .frame-deco {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0;
    }

    .deco-line {
      flex: 1 1 auto;
      max-width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(244, 185, 66, 0.5), transparent);
    }

    .deco-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold-2);
      box-shadow: 0 0 8px rgba(244, 185, 66, 0.8);
      flex: 0 0 auto;
    }

    /* ---------- Main game frame ---------- */
    .panel {
      position: relative;
      background: radial-gradient(circle at 30% 15%, var(--panel-2), var(--panel) 70%);
      border: 1.5px solid rgba(244, 185, 66, 0.55);
      border-radius: 22px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      box-shadow:
        0 0 0 1px rgba(244, 185, 66, 0.12),
        0 0 26px rgba(244, 185, 66, 0.22),
        inset 0 0 40px rgba(244, 185, 66, 0.06);
    }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: rgba(255, 228, 154, 0.9);
      z-index: 3;
      filter: drop-shadow(0 0 5px rgba(244, 185, 66, 0.7));
    }

    .corner.tl {
      top: 10px;
      left: 10px;
      border-top: 2px solid;
      border-left: 2px solid;
      border-radius: 8px 0 0 0;
    }

    .corner.tr {
      top: 10px;
      right: 10px;
      border-top: 2px solid;
      border-right: 2px solid;
      border-radius: 0 8px 0 0;
    }

    .corner.bl {
      bottom: 10px;
      left: 10px;
      border-bottom: 2px solid;
      border-left: 2px solid;
      border-radius: 0 0 0 8px;
    }

    .corner.br {
      bottom: 10px;
      right: 10px;
      border-bottom: 2px solid;
      border-right: 2px solid;
      border-radius: 0 0 8px 0;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
      text-align: center;
    }

    .value {
      font-family: var(--mono);
      font-weight: 800;
      font-size: clamp(32px, 9vw, 52px);
      letter-spacing: 0.5px;
      color: var(--text);
      text-shadow: 0 0 24px rgba(46, 155, 255, 0.35);
      transition: color .15s ease;
    }

    .value.tier-mid {
      text-shadow: 0 0 28px rgba(168, 85, 247, 0.45);
    }

    .value.tier-high {
      text-shadow: 0 0 30px rgba(255, 45, 120, 0.5);
    }

    .value.crashed {
      color: var(--red);
      text-shadow: 0 0 30px rgba(255, 59, 59, 0.55);
    }

    .status-line {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .status-line .flew {
      color: var(--red);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-line svg {
      display: block;
    }

    .encourage-msg {
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: none;
      font-weight: 600;
      color: var(--text-dim);
    }

    .big-countdown-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .overlay.is-countdown .big-countdown-wrap {
      display: flex;
    }

    .overlay.is-countdown .value {
      display: none;
    }

    .overlay.is-countdown .status-line {
      display: none;
    }

    .countdown-label {
      font-size: clamp(11px, 2.6vw, 15px);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-2);
    }

    .big-countdown {
      font-family: var(--mono);
      font-weight: 900;
      font-size: clamp(90px, 32vw, 190px);
      line-height: 0.88;
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 30px rgba(244, 185, 66, 0.55));
    }

    /* ---------- Mega flash + confetti on big rounds ---------- */
    .panel.mega-flash::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(244, 185, 66, 0.55), transparent 70%);
      animation: flashPulse .7s ease-out;
      pointer-events: none;
      z-index: 4;
    }

    @keyframes flashPulse {
      0% { opacity: 0; }
      15% { opacity: 1; }
      100% { opacity: 0; }
    }

    .confetti-piece {
      position: absolute;
      top: -10px;
      width: 6px;
      height: 10px;
      border-radius: 2px;
      opacity: 0.9;
      animation: confettiFall 1.1s ease-in forwards;
      z-index: 4;
      pointer-events: none;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(220px) rotate(360deg); opacity: 0; }
    }

    .milestone-badge {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 1.4px;
      color: #1a1206;
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
      padding: 5px 12px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(244, 185, 66, 0.6);
      z-index: 5;
      animation: milestonePop 1.8s ease forwards;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes milestonePop {
      0% { opacity: 0; transform: translateX(-50%) translateY(-8px) scale(0.85); }
      12% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      82% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(0.95); }
    }

    /* ---------- History bar ---------- */
    .history {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 0;
      scrollbar-width: none;
    }

    .history::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      white-space: nowrap;
      animation: chipIn .35s ease;
    }

    @keyframes chipIn {
      from {
        opacity: 0;
        transform: translateX(-8px) scale(.9);
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .chip.tier-low {
      color: var(--blue);
      border-color: rgba(46, 155, 255, 0.25);
      background: rgba(46, 155, 255, 0.06);
    }

    .chip.tier-mid {
      color: var(--purple);
      border-color: rgba(168, 85, 247, 0.3);
      background: rgba(168, 85, 247, 0.07);
    }

    .chip.tier-high {
      color: var(--pink);
      border-color: rgba(255, 45, 120, 0.35);
      background: rgba(255, 45, 120, 0.08);
    }

    /* ---------- Gift power section ---------- */
    .gift-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding-top: 0;
    }

    .gift-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      border: 1px solid rgba(244, 185, 66, 0.55);
      border-radius: 4px;
      clip-path: polygon(4% 0, 96% 0, 100% 50%, 96% 100%, 4% 100%, 0 50%);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--gold-1);
      background: rgba(244, 185, 66, 0.06);
    }

    .gift-dash {
      width: 12px;
      height: 1px;
      background: repeating-linear-gradient(90deg, var(--gold-2) 0 3px, transparent 3px 6px);
    }

    .gift-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      width: 100%;
    }

    .gift-card {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 5px 2px 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
      transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease, background .15s ease;
    }

    .gift-card.gift-lit {
      transform: translateY(-2px);
    }

    .gift-card.gift-lit-current {
      transform: translateY(-3px) scale(1.07);
    }

    .gift-icon-wrap {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gift-icon-wrap svg {
      width: 17px;
      height: 17px;
    }

    .gift-icon-wrap img {
      width: 26px;
      height: 26px;
      object-fit: cover;
      border-radius: 50%;
    }

    .gift-name {
      font-size: 7.5px;
      font-weight: 600;
      color: #ece7da;
      text-align: center;
      line-height: 1.15;
      max-width: 100%;
    }

    .gift-value {
      font-family: var(--mono);
      font-weight: 800;
      font-size: 10.5px;
    }

    /* ---------- Footer readout ---------- */
    .readout {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .readout-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .readout-label {
      font-size: 9px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .readout-val {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
    }

    .phase-track {
      display: flex;
      gap: 4px;
    }

    .phase-dot {
      width: 22px;
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      transition: background .2s ease;
    }

    .phase-dot.active {
      background: var(--gold-2);
      box-shadow: 0 0 6px var(--gold-2);
    }

    /* ---------- Predictors / Gift-givers stat panels ---------- */
    .stats-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .stat-panel {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 7px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .stat-header {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--gold-2);
      text-align: center;
    }

    .stat-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 14px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      color: var(--text);
    }

    .stat-rank {
      flex: 0 0 auto;
      width: 11px;
      font-family: var(--mono);
      color: var(--text-faint);
      font-size: 9px;
    }

    .stat-row svg.crown {
      flex: 0 0 auto;
      width: 11px;
      height: 11px;
      filter: drop-shadow(0 0 3px rgba(244, 185, 66, 0.7));
    }

    .stat-name {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-count {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      color: var(--gold-2);
      background: rgba(244, 185, 66, 0.1);
      border-radius: 5px;
      padding: 1px 4px;
    }

    .stat-empty {
      font-size: 9px;
      color: var(--text-faint);
      text-align: center;
      padding: 2px 0;
    }

    .stat-add {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .stat-add input {
      flex: 1 1 auto;
      min-width: 0;
      background: #050505;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 9.5px;
      padding: 4px 6px;
      outline: none;
      font-family: var(--sans);
    }

    .stat-add input::placeholder {
      color: var(--text-faint);
    }

    .stat-add input:focus {
      border-color: var(--gold-2);
    }

    .stat-add button {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(244, 185, 66, 0.55);
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
      color: #241a05;
      font-weight: 900;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .clear-stats-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-faint);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .clear-stats-btn:active {
      background: rgba(244, 185, 66, 0.08);
    }

    .clear-stats-btn svg {
      width: 11px;
      height: 11px;
      flex: 0 0 auto;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">
      <div class="logo-row">
        <svg class="wing" width="52" height="30" viewBox="0 0 52 30" fill="none">
          <path d="M52 4L18 13L28 16L2 22L14 25L44 15" fill="url(#wingGrad1)" />
          <defs>
            <linearGradient id="wingGrad1" x1="0" y1="0" x2="52" y2="0">
              <stop offset="0" stop-color="#c8871a" />
              <stop offset="0.5" stop-color="#f4b942" />
              <stop offset="1" stop-color="#ffe49a" />
            </linearGradient>
          </defs>
        </svg>
        <div class="logo-luck">LUCK</div>
        <svg class="wing right" width="52" height="30" viewBox="0 0 52 30" fill="none">
          <path d="M52 4L18 13L28 16L2 22L14 25L44 15" fill="url(#wingGrad2)" />
          <defs>
            <linearGradient id="wingGrad2" x1="0" y1="0" x2="52" y2="0">
              <stop offset="0" stop-color="#c8871a" />
              <stop offset="0.5" stop-color="#f4b942" />
              <stop offset="1" stop-color="#ffe49a" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="logo-flight">FLIGHT</div>
      <div class="entertainment-note">Burudani Tu • Hakuna Malipo Halisi</div>
    </div>

    <div class="frame-deco">
      <span class="deco-line"></span><span class="deco-dot"></span><span class="deco-line"></span>
    </div>

    <div class="panel" id="panel">
      <canvas id="canvas"></canvas>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="overlay" id="overlay">
        <div class="big-countdown-wrap">
          <div class="countdown-label">NEXT ROUND IN</div>
          <div class="big-countdown" id="bigCountdown">5</div>
        </div>
        <div class="value" id="valueText">1.00x</div>
        <div class="status-line" id="statusLine">
          <span id="flightHypeText">INAPAA...</span>
        </div>
      </div>
    </div>

    <div class="frame-deco">
      <span class="deco-line"></span><span class="deco-dot"></span><span class="deco-line"></span>
    </div>

    <div class="history" id="history"></div>

    <div class="gift-section">
      <div class="gift-label"><span class="gift-dash"></span>CHOOSE GIFT POWER<span class="gift-dash"></span></div>

      <div class="gift-row" id="giftRow">

        <div class="gift-card" data-threshold="1.5" data-color="#22c55e">
          <div class="gift-icon-wrap" style="background:rgba(34,197,94,0.14);">
            <img src="gift/rose.webp" alt="Rose" loading="lazy" decoding="async" onerror="this.style.display='none';">
          </div>
          <div class="gift-name">Rose</div>
          <div class="gift-value" style="color:#22c55e;">1.5x</div>
        </div>

        <div class="gift-card" data-threshold="2" data-color="#22d3ee">
          <div class="gift-icon-wrap" style="background:rgba(34,211,238,0.14);">
            <img src="gift/tiktok.webp" alt="TikTok" loading="lazy" decoding="async" onerror="this.style.display='none';">
          </div>
          <div class="gift-name">TikTok</div>
          <div class="gift-value" style="color:#22d3ee;">2x</div>
        </div>

        <div class="gift-card" data-threshold="3" data-color="#ec4899">
          <div class="gift-icon-wrap" style="background:rgba(236,72,153,0.14);">
            <img src="gift/heartMe.webp" alt="Heart Me" loading="lazy" decoding="async" onerror="this.style.display='none';">
          </div>
          <div class="gift-name">Heart Me</div>
          <div class="gift-value" style="color:#ec4899;">3x</div>
        </div>

        <div class="gift-card" data-threshold="5" data-color="#a855f7">
          <div class="gift-icon-wrap" style="background:rgba(168,85,247,0.14);">
            <img src="gift/donut.webp" alt="Donut" loading="lazy" decoding="async" onerror="this.style.display='none';">
          </div>
          <div class="gift-name">Donut</div>
          <div class="gift-value" style="color:#a855f7;">5x</div>
        </div>

        <div class="gift-card" data-threshold="8" data-color="#f97316">
          <div class="gift-icon-wrap" style="background:rgba(249,115,22,0.14);">
            <img src="gift/fingerHeart.webp" alt="Finger Heart" loading="lazy" decoding="async" onerror="this.style.display='none';">
          </div>
          <div class="gift-name">Finger Heart</div>
          <div class="gift-value" style="color:#f97316;">8x</div>
        </div>

        <div class="gift-card" data-threshold="25" data-color="#eab308">
          <div class="gift-icon-wrap" style="background:rgba(234,179,8,0.14);">
            <img src="gift/lion.webp" alt="Lion" loading="lazy" decoding="async" onerror="this.style.display='none';">
          </div>
          <div class="gift-name">Lion</div>
          <div class="gift-value" style="color:#eab308;">25x</div>
        </div>

      </div>
    </div>

    <div class="readout">
      <div class="readout-item">
        <div class="readout-label">Round</div>
        <div class="readout-val" id="roundNum">#1</div>
      </div>
      <div class="phase-track">
        <div class="phase-dot" id="dotCountdown"></div>
        <div class="phase-dot" id="dotFlight"></div>
        <div class="phase-dot" id="dotResult"></div>
      </div>
      <div class="readout-item" style="align-items:flex-end;">
        <div class="readout-label">All-Time Best</div>
        <div class="readout-val" id="bestVal">—</div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-panel">
        <div class="stat-header">Watabiri</div>
        <div class="stat-list" id="predictorsList"></div>
        <div class="stat-add">
          <input type="text" id="predictorInput" placeholder="Jina..." maxlength="18">
          <button id="predictorAddBtn" type="button" aria-label="Ongeza mtabiri">+</button>
        </div>
      </div>

      <div class="stat-panel">
        <div class="stat-header">Watoa Gift</div>
        <div class="stat-list" id="giftGiversList"></div>
        <div class="stat-add">
          <input type="text" id="giftGiverInput" placeholder="Jina..." maxlength="18">
          <button id="giftGiverAddBtn" type="button" aria-label="Ongeza mtoa gift">+</button>
        </div>
      </div>
    </div>

    <button class="clear-stats-btn" id="clearStatsBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7H20M9 7V4H15V7M6 7L7 20H17L18 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Anza Siku Mpya
    </button>

  </div>

  <script>
    (function () {
      "use strict";

      // ---------- DOM ----------
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const panel = document.getElementById('panel');
      const valueText = document.getElementById('valueText');
      const statusLine = document.getElementById('statusLine');
      const overlayEl = document.getElementById('overlay');
      const bigCountdownEl = document.getElementById('bigCountdown');
      const historyEl = document.getElementById('history');
      const roundNumEl = document.getElementById('roundNum');
      const bestValEl = document.getElementById('bestVal');
      const dotCountdown = document.getElementById('dotCountdown');
      const dotFlight = document.getElementById('dotFlight');
      const dotResult = document.getElementById('dotResult');

      const predictorsListEl = document.getElementById('predictorsList');
      const giftGiversListEl = document.getElementById('giftGiversList');
      const predictorInput = document.getElementById('predictorInput');
      const giftGiverInput = document.getElementById('giftGiverInput');
      const predictorAddBtn = document.getElementById('predictorAddBtn');
      const giftGiverAddBtn = document.getElementById('giftGiverAddBtn');
      const clearStatsBtn = document.getElementById('clearStatsBtn');

      const giftCards = Array.from(document.querySelectorAll('.gift-card'))
        .map(card => ({
          el: card,
          threshold: parseFloat(card.dataset.threshold),
          color: card.dataset.color
        }))
        .sort((a, b) => a.threshold - b.threshold);
      const megaFlashThreshold = giftCards.length
        ? giftCards[giftCards.length - 1].threshold
        : 25;

      // ---------- constants ----------
      const PHASE = { COUNTDOWN: 'countdown', FLIGHT: 'flight', RESULT: 'result' };
      const COUNTDOWN_SECONDS = 5;
      const RESULT_HOLD_MS = 2000;
      const GROWTH_RATE = 0.16; // controls how fast the score climbs
      const VISUAL_MAX_VALUE = 100; // value that maps to the far edge of the panel on a log scale
      const LOW_CRASH_THRESHOLD = 1.5; // below this, show an encouraging note instead of nothing
      const HYPE_INTERVAL_MS = 1100;
      const HYPE_PHRASES = [
        'INAPAA...',
        'TWENDE JUU!',
        'BADO INAPANDA...',
        'SHIKILIA...',
        'KARIBU KUFIKA...',
        'MOTOO!',
        'HAIACHI KUPANDA...'
      ];

      const STORAGE_KEYS = {
        history: 'luckFlightHistory',
        roundIndex: 'luckFlightRoundIndex',
        bestValue: 'luckFlightBestValue',
        predictors: 'luckFlightPredictors',
        giftGivers: 'luckFlightGiftGivers'
      };

      // ---------- safe storage helpers ----------
      // Wrapped so a corrupted value, private-browsing mode, or storage
      // being unavailable never crashes the game — it just falls back to defaults.
      function safeGet(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (raw === null) return fallback;
          return JSON.parse(raw);
        } catch (err) {
          return fallback;
        }
      }

      function safeSet(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (err) {
          // Storage unavailable (private mode, quota, etc.) — game keeps running in-memory.
        }
      }

      // ---------- state ----------
      let phase = PHASE.COUNTDOWN;
      let phaseStart = performance.now();
      let countdownRemaining = COUNTDOWN_SECONDS;
      let currentValue = 1.00;
      let exitPoint = 1.00;
      let flightDurationMs = 0;

      let history = safeGet(STORAGE_KEYS.history, []);
      let roundIndex = safeGet(STORAGE_KEYS.roundIndex, 1);
      let bestValue = safeGet(STORAGE_KEYS.bestValue, null);
      let predictors = safeGet(STORAGE_KEYS.predictors, {});
      let giftGivers = safeGet(STORAGE_KEYS.giftGivers, {});

      let dpr = Math.max(1, window.devicePixelRatio || 1);
      let w = 0, h = 0;

      // trail particles behind the aircraft
      let trail = [];
      let litCount = 0;
      let hypeIndex = 0;
      let hypeLastChange = 0;

      // ---------- helpers ----------
      function tierOf(v) {
        if (v >= 10) return 'high';
        if (v >= 2) return 'mid';
        return 'low';
      }

      function tierColor(tier) {
        if (tier === 'high') return getCss('--pink');
        if (tier === 'mid') return getCss('--purple');
        return getCss('--blue');
      }

      let cssCache = {};
      function getCss(varName) {
        if (cssCache[varName]) return cssCache[varName];
        const v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        cssCache[varName] = v;
        return v;
      }

      function randomExitPoint() {
        // Weighted random: mostly low values, occasionally very high (up to ~100+)
        const r = Math.random();
        let point = 0.9 / (1 - r);
        point = Math.min(point, 100 + Math.random() * 20);
        point = Math.max(1.01, point);
        return Math.round(point * 100) / 100;
      }

      function formatValue(v) {
        return v.toFixed(2) + 'x';
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // ---------- history bar ----------
      function pushHistory(v) {
        history.unshift({
          round: roundIndex,
          value: v,
          time: Date.now()
        });

        if (history.length > 20) {
          history.pop();
        }

        safeSet(STORAGE_KEYS.history, history);
        renderHistory();
      }

      function renderHistory() {
        historyEl.innerHTML = '';
        history.forEach(item => {
          const tier = tierOf(item.value);
          const chip = document.createElement('div');
          chip.className = 'chip tier-' + tier;
          chip.textContent = formatValue(item.value);
          historyEl.appendChild(chip);
        });
      }

      // ---------- gift power tier lighting ----------
      // As the value climbs, gift cards light up left-to-right in the order
      // of their threshold, so viewers see live which "power" has been reached.
      function updateGiftTiers(v) {
        let newLitCount = 0;
        giftCards.forEach(g => {
          if (v >= g.threshold) newLitCount++;
        });

        giftCards.forEach((g, i) => {
          const isLit = i < newLitCount;
          const isCurrent = i === newLitCount - 1;
          g.el.classList.toggle('gift-lit', isLit);
          g.el.classList.toggle('gift-lit-current', isCurrent);
          if (isLit) {
            g.el.style.borderColor = g.color;
            g.el.style.boxShadow = '0 0 10px ' + g.color + (isCurrent ? '99' : '55');
            g.el.style.background = g.color + '14';
          } else {
            g.el.style.borderColor = '';
            g.el.style.boxShadow = '';
            g.el.style.background = '';
          }
        });

        litCount = newLitCount;
      }

      function resetGiftTiers() {
        giftCards.forEach(g => {
          g.el.classList.remove('gift-lit', 'gift-lit-current');
          g.el.style.borderColor = '';
          g.el.style.boxShadow = '';
          g.el.style.background = '';
        });
        litCount = 0;
      }

      // ---------- mega flash + confetti for big rounds ----------
      function triggerMegaFlash() {
        panel.classList.add('mega-flash');
        setTimeout(() => panel.classList.remove('mega-flash'), 700);
        spawnConfetti();
      }

      function spawnConfetti() {
        const colors = ['#f4b942', '#ffe49a', '#ff2d78', '#a855f7', '#2e9bff'];
        for (let i = 0; i < 16; i++) {
          const el = document.createElement('div');
          el.className = 'confetti-piece';
          el.style.left = (Math.random() * 100) + '%';
          el.style.background = colors[Math.floor(Math.random() * colors.length)];
          el.style.animationDelay = (Math.random() * 0.15) + 's';
          panel.appendChild(el);
          setTimeout(() => el.remove(), 1300);
        }
      }

      // Every 50 completed rounds, celebrate the milestone with a small badge + confetti.
      const MILESTONE_INTERVAL = 50;
      function triggerMilestone(completedRound) {
        const badge = document.createElement('div');
        badge.className = 'milestone-badge';
        badge.textContent = 'RAUNDI #' + completedRound + '!';
        panel.appendChild(badge);
        spawnConfetti();
        setTimeout(() => badge.remove(), 1800);
      }

      // ---------- predictors / gift-givers leaderboards ----------
      // Names are matched case-insensitively (trimmed) so "Juma" and "juma "
      // count as the same person; the most-repeated name each day gets the crown.
      function addName(store, storageKey, rawName, renderFn) {
        const trimmed = (rawName || '').trim();
        if (!trimmed) return;
        const normKey = trimmed.toLowerCase();
        if (store[normKey]) {
          store[normKey].count += 1;
        } else {
          store[normKey] = { display: trimmed, count: 1 };
        }
        safeSet(storageKey, store);
        renderFn();
      }

      function renderStatList(store, listEl) {
        listEl.innerHTML = '';
        const entries = Object.values(store).sort((a, b) => b.count - a.count).slice(0, 3);

        if (entries.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'stat-empty';
          empty.textContent = 'Bado hakuna';
          listEl.appendChild(empty);
          return;
        }

        entries.forEach((entry, i) => {
          const row = document.createElement('div');
          row.className = 'stat-row';

          const rankHtml = i === 0
            ? '<svg class="crown" viewBox="0 0 24 24" fill="none"><path d="M3 8L7.5 11.5L12 4L16.5 11.5L21 8L19 18H5L3 8Z" fill="#f4b942"/></svg>'
            : '<span class="stat-rank">' + (i + 1) + '</span>';

          row.innerHTML =
            rankHtml +
            '<span class="stat-name">' + escapeHtml(entry.display) + '</span>' +
            '<span class="stat-count">' + entry.count + '</span>';

          listEl.appendChild(row);
        });
      }

      function renderPredictors() { renderStatList(predictors, predictorsListEl); }
      function renderGiftGivers() { renderStatList(giftGivers, giftGiversListEl); }

      predictorAddBtn.addEventListener('click', () => {
        addName(predictors, STORAGE_KEYS.predictors, predictorInput.value, renderPredictors);
        predictorInput.value = '';
        predictorInput.focus();
      });
      predictorInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') predictorAddBtn.click();
      });

      giftGiverAddBtn.addEventListener('click', () => {
        addName(giftGivers, STORAGE_KEYS.giftGivers, giftGiverInput.value, renderGiftGivers);
        giftGiverInput.value = '';
        giftGiverInput.focus();
      });
      giftGiverInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') giftGiverAddBtn.click();
      });

      clearStatsBtn.addEventListener('click', () => {
        const confirmed = window.confirm('Futa orodha ya Watabiri na Watoa Gift ili kuanza siku mpya? Hatua hii haiwezi kurudishwa.');
        if (!confirmed) return;
        predictors = {};
        giftGivers = {};
        safeSet(STORAGE_KEYS.predictors, predictors);
        safeSet(STORAGE_KEYS.giftGivers, giftGivers);
        renderPredictors();
        renderGiftGivers();
      });

      // ---------- canvas sizing ----------
      function resize() {
        dpr = Math.max(1, window.devicePixelRatio || 1);
        const rect = panel.getBoundingClientRect();
        w = rect.width;
        h = rect.height;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', resize);

      // ---------- phase transitions ----------
      function enterCountdown() {
        phase = PHASE.COUNTDOWN;
        phaseStart = performance.now();
        countdownRemaining = COUNTDOWN_SECONDS;
        currentValue = 1.00;
        trail = [];
        resetGiftTiers();
        setDots('countdown');
        valueText.textContent = formatValue(1.00);
        valueText.classList.remove('crashed', 'tier-mid', 'tier-high');
        overlayEl.classList.add('is-countdown');
        bigCountdownEl.textContent = countdownRemaining;
        roundNumEl.textContent = '#' + roundIndex;
      }

      function enterFlight() {
        phase = PHASE.FLIGHT;
        phaseStart = performance.now();
        exitPoint = randomExitPoint();
        flightDurationMs = (Math.log(exitPoint) / GROWTH_RATE) * 1000;
        setDots('flight');
        overlayEl.classList.remove('is-countdown');
        hypeIndex = 0;
        hypeLastChange = performance.now();
        statusLine.innerHTML = '<span id="flightHypeText">' + HYPE_PHRASES[0] + '</span>';
      }

      function enterResult() {
        phase = PHASE.RESULT;
        phaseStart = performance.now();
        currentValue = exitPoint;
        valueText.textContent = formatValue(currentValue);
        valueText.classList.add('crashed');
        overlayEl.classList.remove('is-countdown');
        setDots('result');

        let flewHtml =
          '<span class="flew"><svg width="14" height="14" viewBox="0 0 24 24" fill="none">' +
          '<path d="M12 2L12 22M12 2L6 8M12 2L18 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>FLEW AWAY!</span>';

        if (currentValue < LOW_CRASH_THRESHOLD) {
          flewHtml += '<span class="encourage-msg">Karibu raundi ijayo — bahati inakuja!</span>';
        }

        statusLine.innerHTML = flewHtml;

        updateGiftTiers(currentValue);

        // Short haptic pulse instead of a sound effect.
        if (navigator.vibrate) {
          navigator.vibrate(currentValue >= megaFlashThreshold ? [40, 40, 40, 40, 80] : [35]);
        }

        if (currentValue >= megaFlashThreshold) {
          triggerMegaFlash();
        }

        if (roundIndex % MILESTONE_INTERVAL === 0) {
          triggerMilestone(roundIndex);
        }

        pushHistory(currentValue);

        if (bestValue === null || currentValue > bestValue) {
          bestValue = currentValue;
          safeSet(STORAGE_KEYS.bestValue, bestValue);
          bestValEl.textContent = formatValue(bestValue);
        }

        roundIndex += 1;
        safeSet(STORAGE_KEYS.roundIndex, roundIndex);
      }

      function setDots(active) {
        dotCountdown.classList.toggle('active', active === 'countdown');
        dotFlight.classList.toggle('active', active === 'flight');
        dotResult.classList.toggle('active', active === 'result');
      }

      // ---------- update loop ----------
      function update(now) {
        const elapsed = now - phaseStart;

        if (phase === PHASE.COUNTDOWN) {
          const remaining = Math.max(0, COUNTDOWN_SECONDS - elapsed / 1000);
          const remainingCeil = Math.ceil(remaining);
          if (remainingCeil !== countdownRemaining && remainingCeil >= 0) {
            countdownRemaining = remainingCeil;
            bigCountdownEl.textContent = Math.max(0, countdownRemaining);
          }
          if (elapsed >= COUNTDOWN_SECONDS * 1000) {
            enterFlight();
          }
        } else if (phase === PHASE.FLIGHT) {
          const progress = Math.min(1, elapsed / flightDurationMs);
          currentValue = Math.exp(GROWTH_RATE * (elapsed / 1000));
          currentValue = Math.min(currentValue, exitPoint);

          const tier = tierOf(currentValue);
          valueText.classList.toggle('tier-mid', tier === 'mid');
          valueText.classList.toggle('tier-high', tier === 'high');
          valueText.textContent = formatValue(currentValue);

          if (now - hypeLastChange >= HYPE_INTERVAL_MS) {
            hypeLastChange = now;
            hypeIndex = (hypeIndex + 1) % HYPE_PHRASES.length;
            const hypeEl = document.getElementById('flightHypeText');
            if (hypeEl) hypeEl.textContent = HYPE_PHRASES[hypeIndex];
          }

          const newLitCount = giftCards.filter(g => currentValue >= g.threshold).length;
          if (newLitCount !== litCount) {
            updateGiftTiers(currentValue);
          }

          if (progress >= 1) {
            enterResult();
          }
        } else if (phase === PHASE.RESULT) {
          if (elapsed >= RESULT_HOLD_MS) {
            enterCountdown();
          }
        }
      }

      // ---------- drawing ----------
      function valueToProgress(v) {
        const clamped = Math.max(1, Math.min(v, VISUAL_MAX_VALUE * 4));
        return Math.min(1, Math.log(clamped) / Math.log(VISUAL_MAX_VALUE));
      }

      function curvePoint(progress) {
        // progress in [0,1] -> normalized x,y within the plot area
        const xNorm = progress;
        const yNorm = Math.pow(progress, 0.82);
        return { x: xNorm, y: yNorm };
      }

      function draw(now) {
        ctx.clearRect(0, 0, w, h);

        // padding for the plot area
        const padL = 28, padR = 28, padT = 34, padB = 40;
        const plotW = Math.max(10, w - padL - padR);
        const plotH = Math.max(10, h - padT - padB);
        const baseX = padL;
        const baseY = h - padB;

        drawGrid(baseX, baseY, plotW, plotH);

        let progress = 0;
        if (phase === PHASE.FLIGHT || phase === PHASE.RESULT) {
          // Path length reflects the value itself (log scale), not time elapsed —
          // a low round stops early on screen, a big run travels further.
          progress = valueToProgress(currentValue);
        } else {
          progress = 0;
        }

        const tier = tierOf(currentValue);
        const color = tierColor(tier);

        if (progress > 0.001) {
          drawFlightPath(baseX, baseY, plotW, plotH, progress, color, tier, phase);
        } else {
          drawIdleDot(baseX, baseY);
        }
      }

      function drawGrid(baseX, baseY, plotW, plotH) {
        const gridColor = getCss('--grid-line');
        ctx.save();
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;

        const cols = 8, rows = 6;
        for (let i = 0; i <= cols; i++) {
          const x = baseX - 6 + (plotW + 12) * (i / cols);
          ctx.beginPath();
          ctx.moveTo(x, 8);
          ctx.lineTo(x, baseY + 6);
          ctx.stroke();
        }
        for (let j = 0; j <= rows; j++) {
          const y = 8 + (baseY - 8) * (j / rows);
          ctx.beginPath();
          ctx.moveTo(baseX - 14, y);
          ctx.lineTo(baseX + plotW + 14, y);
          ctx.stroke();
        }

        // baseline axis
        ctx.strokeStyle = 'rgba(244,185,66,0.12)';
        ctx.beginPath();
        ctx.moveTo(baseX - 14, baseY);
        ctx.lineTo(baseX + plotW + 14, baseY);
        ctx.stroke();

        ctx.restore();
      }

      function drawIdleDot(baseX, baseY) {
        ctx.save();
        ctx.fillStyle = getCss('--blue');
        ctx.shadowColor = getCss('--blue');
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(baseX, baseY, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawFlightPath(baseX, baseY, plotW, plotH, progress, color, tier, currentPhase) {
        const samples = 64;
        const points = [];
        for (let i = 0; i <= samples; i++) {
          const p = (i / samples) * progress;
          const cp = curvePoint(p);
          const x = baseX + cp.x * plotW;
          const y = baseY - cp.y * plotH;
          points.push({ x, y });
        }

        const last = points[points.length - 1];

        // filled area under the curve
        ctx.save();
        const grad = ctx.createLinearGradient(0, 0, 0, baseY);
        grad.addColorStop(0, hexToRgba(color, 0.28));
        grad.addColorStop(1, hexToRgba(color, 0.0));
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        points.forEach(pt => ctx.lineTo(pt.x, pt.y));
        ctx.lineTo(last.x, baseY);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();

        // glowing stroke line
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.shadowColor = color;
        ctx.shadowBlur = currentPhase === 'result' ? 6 : 16;
        ctx.beginPath();
        points.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
        ctx.restore();

        // trail particles
        if (currentPhase === 'flight') {
          trail.push({ x: last.x, y: last.y, born: performance.now() });
          if (trail.length > 26) trail.shift();
        }
        ctx.save();
        const nowT = performance.now();
        trail.forEach(pt => {
          const age = (nowT - pt.born) / 600;
          if (age >= 1) return;
          ctx.globalAlpha = (1 - age) * 0.5;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2.4 * (1 - age * 0.6), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
        trail = trail.filter(pt => (nowT - pt.born) < 600);

        // aircraft icon
        const prevIdx = Math.max(0, points.length - 3);
        const prev = points[prevIdx];
        const angle = Math.atan2(last.y - prev.y, last.x - prev.x);
        drawAircraft(last.x, last.y, angle, color, currentPhase === 'result');
      }

      function hexToRgba(hex, alpha) {
        let c = hex.trim();
        if (c[0] !== '#') return c;
        c = c.substring(1);
        if (c.length === 3) {
          c = c.split('').map(ch => ch + ch).join('');
        }
        const num = parseInt(c, 16);
        const r = (num >> 16) & 255;
        const g = (num >> 8) & 255;
        const b = num & 255;
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      }

      function drawAircraft(x, y, angle, color, crashed) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        const glowColor = crashed ? getCss('--red') : color;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = crashed ? 12 : 20;

        // swept wings (drawn first, behind the fuselage)
        ctx.fillStyle = crashed ? getCss('--red') : hexToRgba('#f5f7fa', 0.9);
        ctx.beginPath();
        ctx.moveTo(-1, -2.2);
        ctx.lineTo(-12, -10.5);
        ctx.lineTo(-7.5, -1.5);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-1, 2.2);
        ctx.lineTo(-12, 10.5);
        ctx.lineTo(-7.5, 1.5);
        ctx.closePath();
        ctx.fill();

        // tail fin
        ctx.beginPath();
        ctx.moveTo(-7, 0);
        ctx.lineTo(-12, -4.5);
        ctx.lineTo(-9.5, 0);
        ctx.lineTo(-12, 4.5);
        ctx.closePath();
        ctx.fill();

        // fuselage / nose
        ctx.fillStyle = crashed ? getCss('--red') : '#f5f7fa';
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(-2, -3.2);
        ctx.lineTo(-9, -1.6);
        ctx.lineTo(-9, 1.6);
        ctx.lineTo(-2, 3.2);
        ctx.closePath();
        ctx.fill();

        // cockpit highlight
        ctx.fillStyle = glowColor;
        ctx.beginPath();
        ctx.arc(6, 0, 1.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // ---------- main loop ----------
      function frame(now) {
        update(now);
        draw(now);
        requestAnimationFrame(frame);
      }

      // ---------- init ----------
      function init() {
        resize();
        renderHistory();
        renderPredictors();
        renderGiftGivers();
        if (bestValue !== null) {
          bestValEl.textContent = formatValue(bestValue);
        }
        enterCountdown();
        requestAnimationFrame(frame);
      }

      init();
    })();
  </script>

  <script>
    // ---------- PWA service worker ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {
          // Offline caching is a bonus, not required for the game to run.
        });
      });
    }
  </script>

</body>

</html>
